<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Perennial UI: the interface that grows back">
  <defs>
    <radialGradient id="glowA" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#7BD88F" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7BD88F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#F3A6C4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F3A6C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2B2C" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0D151C" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#0A1018"/>
  <rect width="1280" height="640" fill="url(#glowA)"/>
  <rect width="1280" height="640" fill="url(#glowB)"/>

  <!-- one glass panel, with the lit top edge and accent rail the UI uses -->
  <rect x="96" y="120" width="1088" height="400" rx="12" fill="url(#glass)"/>
  <rect x="96.5" y="120.5" width="1087" height="399" rx="11.5" fill="none" stroke="#7BD88F" stroke-opacity="0.42"/>
  <rect x="110" y="122" width="1060" height="1" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="98" y="134" width="5" height="372" fill="#7BD88F"/>

  <g transform="translate(300 320)">
    <ellipse cx="0" cy="-66" rx="50" ry="74" fill="#7BD88F"/>
    <ellipse cx="66" cy="0" rx="74" ry="50" fill="#F3A6C4" fill-opacity="0.8"/>
    <ellipse cx="0" cy="66" rx="50" ry="74" fill="#7BD88F" fill-opacity="0.55"/>
    <ellipse cx="-66" cy="0" rx="74" ry="50" fill="#F3A6C4" fill-opacity="0.4"/>
    <circle r="20" fill="#FFFFFF"/>
  </g>

  <text x="500" y="318" font-family="Sora" font-weight="700" font-size="92" letter-spacing="-2" fill="#EEF4F8">Perennial UI</text>
  <text x="504" y="372" font-family="DM Sans" font-weight="500" font-size="30" fill="#A3B3C0">The interface that grows back.</text>
  <text x="504" y="430" font-family="DM Mono" font-weight="500" font-size="20" fill="#7BD88F">open source  ·  modular  ·  WoW: Forever</text>

  <g transform="translate(504 462)">
    <rect width="34" height="6" rx="3" fill="#7BD88F"/>
    <rect x="42" width="34" height="6" rx="3" fill="#FFC24B"/>
    <rect x="84" width="34" height="6" rx="3" fill="#FF8A4C"/>
    <rect x="126" width="34" height="6" rx="3" fill="#7CC4FF"/>
  </g>
</svg>
