<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Perennial UI logo: four glass petals turning through a season's two colours">
  <defs>
    <linearGradient id="petalA" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#B9F4C6"/><stop offset="0.5" stop-color="#7BD88F"/><stop offset="1" stop-color="#3A9A55"/>
    </linearGradient>
    <linearGradient id="petalB" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FCD6E4"/><stop offset="0.5" stop-color="#F3A6C4"/><stop offset="1" stop-color="#B4628A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/><stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9D6DF"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <ellipse id="petal" cx="0" cy="-66" rx="50" ry="74"/>
    <ellipse id="rim" cx="0" cy="-66" rx="49" ry="73" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="1.6"/>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16242A"/><stop offset="1" stop-color="#0B1119"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#tile)"/>
  <rect x="5" y="5" width="502" height="502" rx="59" fill="none" stroke="#7BD88F" stroke-opacity="0.5" stroke-width="8"/>
  <g transform="translate(256 256) scale(1.38)">
    <ellipse cx="0" cy="16" rx="120" ry="112" fill="#000000" opacity="0.5" filter="url(#shadow)"/>
    <g opacity="0.5"><g transform="rotate(270)"><use href="#petal" fill="url(#petalB)"/><use href="#rim"/></g><ellipse cx="-92.0" cy="-15.0" rx="33" ry="19" fill="url(#sheen)"/></g>
    <g opacity="0.62"><g transform="rotate(180)"><use href="#petal" fill="url(#petalA)"/><use href="#rim"/></g><ellipse cx="-14.0" cy="38.0" rx="20" ry="33" fill="url(#sheen)"/></g>
    <g opacity="0.86"><g transform="rotate(90)"><use href="#petal" fill="url(#petalB)"/><use href="#rim"/></g><ellipse cx="40.0" cy="-15.0" rx="33" ry="19" fill="url(#sheen)"/></g>
    <g opacity="0.96"><g transform="rotate(0)"><use href="#petal" fill="url(#petalA)"/><use href="#rim"/></g><ellipse cx="-14.0" cy="-94.0" rx="20" ry="33" fill="url(#sheen)"/></g>
    <circle r="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
    <circle r="19" fill="url(#core)"/>
  </g>
</svg>
